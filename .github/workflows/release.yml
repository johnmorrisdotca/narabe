name: Release
# A version tag builds the package and attaches its tarball to a GitHub release.
# A project depends on that file at a pinned version, e.g. in package.json:
#   "@johnmorrisdotca/narabe": "https://github.com/johnmorrisdotca/narabe/releases/download/v1.0.0/johnmorrisdotca-narabe-1.0.0.tgz"
# A manual run releases the version package.json names, creating its tag at the
# commit it runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: The tag is the version in package.json
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm pack
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." --verify-tag
          else
            TAG="v$(node -p "require('./package.json').version")"
            gh release create "$TAG" ./*.tgz --title "$TAG" --notes "See CHANGELOG.md." --target "$GITHUB_SHA"
          fi
